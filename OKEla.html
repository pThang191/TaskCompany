<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> pth</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 100px;
            background-color: #ff3366;
            transform: rotate(-45deg);
            /* Hiệu ứng nhấp nháy */
            animation: beat 1.2s infinite;
            box-shadow: 0 0 40px #ff3366;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #ff3366;
            border-radius: 50%;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        /* Định nghĩa chuyển động đập/nhấp nháy */
        @keyframes beat {
            0% {
                transform: rotate(-45deg) scale(1);
                opacity: 1;
            }
            50% {
                transform: rotate(-45deg) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: rotate(-45deg) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="heart"></div>
    <div >
        <H1> 
            ABCAD
        </H1> 
        <h2> Thang vua update</h2>
    </div>
</body>
</html>
